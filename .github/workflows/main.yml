name: CI

on:
  push:
    branches: ['**'] # 不含 tag 推送, 避免重复触发
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BINARY_PREFIX: "baidupcs-go_"
  BINARY_SUFFIX: ""
  PR_PROMPT: "::warning:: Build artifact will not be uploaded due to the workflow is trigged by pull request."
  LD_FLAGS: "-w -s"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04 # 钉住版本, 避免 ubuntu-latest 标签迁移引入不可控变化
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # 模块缓存统一由下方 actions/cache 策略处理, 避免重复缓存
      - name: Run unit tests
        run: go test ./...

  build:
    name: Build binary CI
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # build and publish in parallel: linux/386, linux/amd64, windows/386, windows/amd64, darwin/amd64, darwin/arm64
        goos: [linux, windows, darwin]
        goarch: ["386", amd64, arm, arm64]
        exclude:
          - goos: darwin
            goarch: arm
          - goos: darwin
            goarch: "386"
          - goos: windows
            goarch: arm64
      fail-fast: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 拉全历史, 供 git describe 生成版本号
      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache build cache
        # 只缓存 ~/.cache/go-build。不要把 ~/go/pkg/mod 加进来: 模块缓存的只读目录
        # 结构经 tar 打包/恢复会产生大量 "Cannot open: File exists" 错误(恢复失败),
        # 模块冷下载仅十几秒, 不值得缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
      - name: Build binary file
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          IS_PR: ${{ !!github.head_ref }}
        run: |
          if [ $GOOS = "windows" ]; then export BINARY_SUFFIX="$BINARY_SUFFIX.exe"; fi
          if $IS_PR ; then echo $PR_PROMPT; fi
          export BINARY_NAME="$BINARY_PREFIX${GOOS}_${GOARCH}$BINARY_SUFFIX"
          export CGO_ENABLED=0
          export LD_FLAGS="$LD_FLAGS -X main.Version=$(git describe --tags --always)"
          go build -o "output/$BINARY_NAME" -trimpath -ldflags "$LD_FLAGS" .
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: ${{ !github.head_ref }}
        with:
          name: ${{ matrix.goos }}_${{ matrix.goarch }}
          path: output/
